name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Lint
        run: |
          ruff check src api tests app
          ruff format --check src api tests app
      - name: Type check
        run: mypy
      - name: Tests with coverage (threshold in pyproject.toml)
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t energy-api:ci .
      - name: Build app image
        run: docker build -f docker/Dockerfile.app -t energy-app:ci .
